services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_fsm
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .                  
      dockerfile: backend/Dockerfile 
    container_name: fastapi_bot
    ports:
      - "8000:8000"               
    environment:
      - BOT_TOKEN=ВАШ_ТОКЕН_БОТА
      - WEBHOOK_URL=https://your-domain.com
      - REDIS_HOST=redis          
      - REDIS_PORT=6379
      - DB_HOST=postgres         
      - DB_USER=test
      - DB_PASSWORD=test
      - DB_NAME=test
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy 
      redis:
        condition: service_healthy 

volumes:
  postgres_data:
